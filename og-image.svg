<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#58cc02"/>
      <stop offset="100%" style="stop-color:#58a700"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#FFA500"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Trophy icon -->
  <g transform="translate(100, 180)">
    <path d="M50 0 L150 0 L140 80 Q100 120 60 80 Z" fill="url(#gold)"/>
    <path d="M40 15 Q10 15 10 50 Q10 85 50 75" fill="none" stroke="url(#gold)" stroke-width="12" stroke-linecap="round"/>
    <path d="M160 15 Q190 15 190 50 Q190 85 150 75" fill="none" stroke="url(#gold)" stroke-width="12" stroke-linecap="round"/>
    <rect x="70" y="95" width="60" height="20" rx="5" fill="url(#gold)"/>
    <rect x="55" y="115" width="90" height="15" rx="5" fill="url(#gold)"/>
    <polygon points="100,25 105,40 120,40 108,50 112,65 100,55 88,65 92,50 80,40 95,40" fill="white"/>
  </g>
  
  <!-- Title -->
  <text x="320" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="80" font-weight="800" fill="white">MyDailyWin</text>
  
  <!-- Subtitle -->
  <text x="320" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="36" fill="white" opacity="0.95">Turn Daily Habits into Daily Wins</text>
  
  <!-- Features -->
  <text x="320" y="430" font-family="system-ui, -apple-system, sans-serif" font-size="28" fill="white" opacity="0.85">🚶 Stay Active  •  🧠 Stay Sharp  •  💰 Get Paid</text>
  
  <!-- URL -->
  <text x="320" y="530" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="white" opacity="0.7">mydailywin.web.app</text>
