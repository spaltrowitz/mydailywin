<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - MyDailyWin</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="css/offline.css">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-src 'none';">
</head>
<body>
    <div class="icon">📶</div>
    <h1>You're Offline</h1>
    <p>It looks like you've lost your internet connection. Don't worry - your progress is saved locally!</p>
    
    <button class="btn" data-action="reload">🔄 Try Again</button>
    
    <div class="tips">
        <h3>💡 While you're offline:</h3>
        <ul>
            <li>Your habit data is saved on this device</li>
            <li>Complete tasks offline - they'll sync when you're back online</li>
            <li>Check your WiFi or mobile data connection</li>
        </ul>
    </div>

    <script src="js/offline.js"></script>
</body>
</html>
