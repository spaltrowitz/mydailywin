<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - MyDailyWin</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <style>
        :root {
            --primary: #58cc02;
            --bg: #f7f7f7;
            --text: #3c3c3c;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }
        .icon {
            font-size: 80px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        p {
            color: #595959;
            margin-bottom: 30px;
            max-width: 400px;
        }
        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
        .btn:hover {
            opacity: 0.9;
        }
        .tips {
            margin-top: 40px;
            padding: 20px;
            background: white;
            border-radius: 16px;
            max-width: 400px;
        }
        .tips h3 {
            margin-bottom: 10px;
            font-size: 16px;
        }
        .tips ul {
            text-align: left;
            padding-left: 20px;
            font-size: 14px;
            color: #666;
        }
        .tips li {
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <div class="icon">📶</div>
    <h1>You're Offline</h1>
    <p>It looks like you've lost your internet connection. Don't worry - your progress is saved locally!</p>
    
    <button class="btn" onclick="location.reload()">🔄 Try Again</button>
    
    <div class="tips">
        <h3>💡 While you're offline:</h3>
        <ul>
            <li>Your habit data is saved on this device</li>
            <li>Complete tasks offline - they'll sync when you're back online</li>
            <li>Check your WiFi or mobile data connection</li>
        </ul>
    </div>

    <script>
        // Auto-reload when connection is restored
        window.addEventListener('online', () => {
            location.reload();
        });
    </script>
</body>
</html>
