<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - MyDailyWin</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/shared.css">
    <link rel="stylesheet" href="css/login.css">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://apis.google.com https://cdn.jsdelivr.net https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://*.firebaseapp.com https://*.cloudfunctions.net wss://*.firebaseio.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://accounts.google.com; img-src 'self' data: blob: https://www.gstatic.com https://*.googleusercontent.com; frame-src https://*.firebaseapp.com https://accounts.google.com https://appleid.apple.com; object-src 'none'; base-uri 'self'">
</head>
<body>
    <script src="js/dark-mode.js"></script>
    <div class="login-card">
        <a href="home.html" style="text-decoration: none; color: inherit; cursor: pointer;">
            <div class="logo">🏆</div>
            <h1>MyDaily<span style="color: #ff9600;">Win</span></h1>
        </a>
        <p class="subtitle">Sign in to access your profiles</p>
        
        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>
        
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <span>Signing in...</span>
        </div>
        
        <div id="userInfo" class="user-info">
            <div class="user-avatar" id="userAvatar">👤</div>
            <div class="user-details">
                <div class="user-name" id="userName"></div>
                <div class="user-email" id="userEmail"></div>
            </div>
            <button class="btn-signout" data-action="signOut">Sign Out</button>
        </div>
        
        <div id="authButtons">
            <button class="btn btn-google" data-action="signInWithGoogle">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" loading="lazy" width="20" height="20">
                Continue with Google
            </button>
            
            <button class="btn btn-apple" data-action="signInWithApple">
                <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M17.05 20.28c-.98.95-2.05.88-3.08.4-1.09-.5-2.08-.48-3.24 0-1.44.62-2.2.44-3.06-.4C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/></svg>
                Continue with Apple
            </button>
            
            <div class="divider">or</div>
            
            <button class="btn btn-email" data-action="showEmailForm">
                ✉️ Continue with Email
            </button>
            
            <div id="emailForm" class="email-form">
                <input type="email" id="email" placeholder="Email address" autocomplete="email">
                <div style="position: relative;">
                    <input type="password" id="password" placeholder="Password" autocomplete="current-password">
                    <button type="button" data-action="togglePassword" id="togglePwBtn"
                        style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;font-size:20px;cursor:pointer;padding:8px;min-width:44px;min-height:44px;"
                        aria-label="Show password">👁️</button>
                </div>
                <button class="btn btn-email" data-action="signInWithEmail">Sign In</button>
                <a class="forgot-password-link" data-action="showResetForm">Forgot password?</a>
                <button class="btn btn-google" data-action="createAccount">Create Account</button>
            </div>
            
            <div id="resetForm" class="reset-form">
                <p style="font-size: 14px; color: var(--text-light); margin-bottom: 12px;">Enter your email and we'll send a reset link.</p>
                <input type="email" id="resetEmail" placeholder="Email address" autocomplete="email">
                <button class="btn btn-reset" data-action="sendResetEmail">Send Reset Link</button>
                <button class="btn btn-cancel" data-action="hideResetForm">Cancel</button>
            </div>
        </div>
        
        <div id="profileSection" class="profile-list" style="display: none;">
            <h3>👤 Your Profiles</h3>
            <p style="font-size: 14px; color: var(--text-light); margin-bottom: 10px;">Profiles you created</p>
            <div id="profileList"></div>
            
            <div id="managedSection" style="margin-top: 20px; display: none;">
                <h3>👥 Profiles You Manage</h3>
                <p style="font-size: 14px; color: var(--text-light); margin-bottom: 10px;">You've been added as an admin</p>
                <div id="managedList"></div>
            </div>
            
            <button class="btn btn-email" data-action="createNewProfile" style="margin-top: 15px;">
                ➕ Create New Profile
            </button>
        </div>
        
        <a href="home.html?v=2" class="back-link">← Back to Homepage</a>
    </div>
    <script src="js/sw-init.js"></script>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/utils.js"></script>
    
    <script src="js/login.js"></script>
</body>
</html>
